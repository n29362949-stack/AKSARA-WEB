
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock - Multi Timezone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: background 0.3s ease;
    }

    body.light-mode {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    body.light-mode .header {
      color: #333;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      backdrop-filter: blur(10px);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .btn.active {
      background: rgba(255, 255, 255, 0.4);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .clocks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .clock-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      color: white;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body.light-mode .clock-card {
      background: rgba(255, 255, 255, 0.7);
      color: #333;
      border: 1px solid rgba(100, 100, 100, 0.2);
    }

    .clock-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    body.light-mode .clock-card:hover {
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
    }

    .timezone-name {
      font-size: 0.9em;
      opacity: 0.8;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .digital-time {
      font-size: 2.5em;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      margin: 15px 0;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    body.light-mode .digital-time {
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .time-details {
      font-size: 0.9em;
      opacity: 0.8;
      margin-top: 10px;
      line-height: 1.6;
    }

    .time-format-toggle {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .format-btn {
      padding: 8px 16px;
      border: 2px solid white;
      border-radius: 20px;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    body.light-mode .format-btn {
      border-color: #333;
      color: #333;
    }

    .format-btn.active {
      background: white;
      color: #667eea;
    }

    body.light-mode .format-btn.active {
      background: #333;
      color: white;
    }

    .status {
      text-align: center;
      color: white;
      font-size: 0.95em;
      opacity: 0.9;
    }

    body.light-mode .status {
      color: #333;
    }

    .add-timezone {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .add-timezone select,
    .add-timezone input {
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
    }

    .add-timezone select:focus,
    .add-timezone input:focus {
      outline: none;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .remove-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 73, 73, 0.8);
      color: white;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2em;
      transition: all 0.3s ease;
      display: none;
    }

    .clock-card {
      position: relative;
    }

    .clock-card:hover .remove-btn {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .remove-btn:hover {
      background: rgba(255, 73, 73, 1);
      transform: scale(1.1);
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8em;
      }

      .digital-time {
        font-size: 1.8em;
      }

      .clocks-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>⏰ Digital Clock</h1>
    <p>Worldwide Time Zones</p>
  </div>

  <div class="controls">
    <button class="btn active" onclick="toggleTheme()">🌙 Mode Gelap</button>
    <button class="btn" onclick="resetClocks()">🔄 Reset</button>
  </div>

  <div class="time-format-toggle">
    <button class="format-btn active" onclick="setFormat('24h')">24-Hour</button>
    <button class="format-btn" onclick="setFormat('12h')">12-Hour</button>
  </div>

  <div class="add-timezone">
    <select id="timezoneSelect" onchange="addCustomTimezone()">
      <option value="">+ Tambah Zona Waktu</option>
      <option value="America/New_York">New York (EST)</option>
      <option value="Europe/London">London (GMT)</option>
      <option value="Europe/Paris">Paris (CET)</option>
      <option value="Asia/Dubai">Dubai (GST)</option>
      <option value="Asia/Singapore">Singapore (SGT)</option>
      <option value="Asia/Hong_Kong">Hong Kong (HKT)</option>
      <option value="Australia/Sydney">Sydney (AEDT)</option>
      <option value="Pacific/Auckland">Auckland (NZDT)</option>
      <option value="America/Los_Angeles">Los Angeles (PST)</option>
      <option value="America/Chicago">Chicago (CST)</option>
      <option value="America/Denver">Denver (MST)</option>
      <option value="Asia/Tokyo">Tokyo (JST)</option>
      <option value="Asia/Shanghai">Shanghai (CST)</option>
      <option value="Asia/Bangkok">Bangkok (ICT)</option>
      <option value="Asia/Kolkata">India (IST)</option>
      <option value="Europe/Moscow">Moscow (MSK)</option>
      <option value="Africa/Cairo">Cairo (EET)</option>
      <option value="Africa/Johannesburg">Johannesburg (SAST)</option>
      <option value="America/Sao_Paulo">São Paulo (BRT)</option>
    </select>
  </div>

  <div class="clocks-grid" id="clocksContainer">
    <!-- Clock cards will be inserted here -->
  </div>

  <div class="status">
    <p id="statusText">Memuat waktu...</p>
  </div>
</div>

<script>
  let timeFormat = '24h';
  const defaultTimezones = [
    { name: 'Jakarta', tz: 'Asia/Jakarta' },
    { name: 'London', tz: 'Europe/London' },
    { name: 'New York', tz: 'America/New_York' },
    { name: 'Tokyo', tz: 'Asia/Tokyo' },
    { name: 'Sydney', tz: 'Australia/Sydney' }
  ];

  let customTimezones = [];

  // Load custom timezones from localStorage
  function loadCustomTimezones() {
    const saved = localStorage.getItem('customTimezones');
    if (saved) {
      try {
        customTimezones = JSON.parse(saved);
      } catch (e) {
        customTimezones = [];
      }
    }
  }

  // Save custom timezones to localStorage
  function saveCustomTimezones() {
    localStorage.setItem('customTimezones', JSON.stringify(customTimezones));
  }

  // Get all timezones to display
  function getAllTimezones() {
    return [...defaultTimezones, ...customTimezones];
  }

  // Format time according to user preference
  function formatTime(date) {
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');

    if (timeFormat === '24h') {
      return `${hours}:${minutes}:${seconds}`;
    } else {
      let h = date.getHours();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      h = h ? h : 12;
      return `${String(h).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
    }
  }

  // Update all clocks
  function updateClocks() {
    const container = document.getElementById('clocksContainer');
    const timezones = getAllTimezones();

    if (container.children.length === 0) {
      // Create clock cards for the first time
      timezones.forEach((tz, index) => {
        const card = document.createElement('div');
        card.className = 'clock-card';
        card.id = `clock-${index}`;
        card.innerHTML = `
          <button class="remove-btn" onclick="removeTimezone(${index})">×</button>
          <div class="timezone-name">${tz.name}</div>
          <div class="digital-time" id="time-${index}">--:--:--</div>
          <div class="time-details">
            <div id="date-${index}">Loading...</div>
            <div id="offset-${index}">Loading...</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Update time for each timezone
    timezones.forEach((tz, index) => {
      try {
        const formatter = new Intl.DateTimeFormat('id-ID', {
          timeZone: tz.tz,
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        const timeFormatter = new Intl.DateTimeFormat('id-ID', {
          timeZone: tz.tz,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });

        const date = new Date();
        const localDate = new Date(date.toLocaleString('en-US', { timeZone: tz.tz }));
        
        const timeStr = formatTime(localDate);
        const dateStr = formatter.format(date);

        // Calculate offset
        const utcDate = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
        const tzDate = new Date(date.toLocaleString('en-US', { timeZone: tz.tz }));
        const offset = (tzDate - utcDate) / (1000 * 60 * 60);
        const offsetStr = `UTC ${offset >= 0 ? '+' : ''}${offset}`;

        const timeElement = document.getElementById(`time-${index}`);
        const dateElement = document.getElementById(`date-${index}`);
        const offsetElement = document.getElementById(`offset-${index}`);

        if (timeElement) timeElement.textContent = timeStr;
        if (dateElement) dateElement.textContent = dateStr;
        if (offsetElement) offsetElement.textContent = offsetStr;
      } catch (e) {
        console.error(`Error updating timezone ${tz.name}:`, e);
      }
    });

    // Update status
    const statusText = document.getElementById('statusText');
    if (statusText) {
      const now = new Date();
      statusText.textContent = `Last updated: ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    }
  }

  // Add custom timezone
  function addCustomTimezone() {
    const select = document.getElementById('timezoneSelect');
    const tz = select.value;

    if (!tz) return;

    // Get timezone name from option text
    const option = select.options[select.selectedIndex];
    const name = option.text.split('(')[0].trim();

    // Check if already exists
    if (customTimezones.some(t => t.tz === tz)) {
      alert('Zona waktu ini sudah ditambahkan!');
      select.value = '';
      return;
    }

    customTimezones.push({ name, tz });
    saveCustomTimezones();
    select.value = '';

    // Rebuild clocks
    document.getElementById('clocksContainer').innerHTML = '';
    updateClocks();
  }

  // Remove timezone
  function removeTimezone(index) {
    if (index < defaultTimezones.length) {
      alert('Tidak dapat menghapus zona waktu bawaan');
      return;
    }

    const customIndex = index - defaultTimezones.length;
    customTimezones.splice(customIndex, 1);
    saveCustomTimezones();

    document.getElementById('clocksContainer').innerHTML = '';
    updateClocks();
  }

  // Toggle dark/light theme
  function toggleTheme() {
    document.body.classList.toggle('light-mode');
    localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
  }

  // Set time format
  function setFormat(format) {
    timeFormat = format;
    document.querySelectorAll('.format-btn').forEach(btn => {
      btn.classList.remove('active');
    });
    event.target.classList.add('active');
    localStorage.setItem('timeFormat', format);
    updateClocks();
  }

  // Reset to defaults
  function resetClocks() {
    if (confirm('Reset ke zona waktu default?')) {
      customTimezones = [];
      saveCustomTimezones();
      document.getElementById('clocksContainer').innerHTML = '';
      updateClocks();
    }
  }

  // Initialize
  function init() {
    loadCustomTimezones();

    // Load saved preferences
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.body.classList.add('light-mode');
    }

    const savedFormat = localStorage.getItem('timeFormat');
    if (savedFormat) {
      timeFormat = savedFormat;
      document.querySelectorAll('.format-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`[onclick="setFormat('${savedFormat}')"]`)?.classList.add('active');
    }

    updateClocks();
    setInterval(updateClocks, 1000);
  }

  // Start when page loads
  window.addEventListener('load', init);
</script>

</body>
  </html>
